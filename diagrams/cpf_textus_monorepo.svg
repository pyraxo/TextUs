<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">CPF Board TextUs - Monorepo Structure</text>
  
  <!-- Root folder -->
  <g id="root-folder">
    <rect x="50" y="80" width="900" height="660" rx="5" ry="5" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    <text x="70" y="110" font-family="Arial" font-size="18" font-weight="bold">cpf-textus/</text>
    
    <!-- Documentation -->
    <rect x="80" y="130" width="240" height="140" rx="5" ry="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" />
    <text x="100" y="155" font-family="Arial" font-size="16" font-weight="bold">docs/</text>
    
    <rect x="100" y="170" width="200" height="30" rx="3" ry="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1" />
    <text x="115" y="190" font-family="Arial" font-size="14">prd.md</text>
    
    <rect x="100" y="210" width="200" height="30" rx="3" ry="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1" />
    <text x="115" y="230" font-family="Arial" font-size="14">architecture.md</text>
    
    <rect x="100" y="250" width="200" height="30" rx="3" ry="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1" />
    <text x="115" y="270" font-family="Arial" font-size="14">changelog.md</text>
    
    <!-- Frontend -->
    <rect x="80" y="280" width="240" height="420" rx="5" ry="5" fill="#fff3e0" stroke="#e65100" stroke-width="1" />
    <text x="100" y="305" font-family="Arial" font-size="16" font-weight="bold">frontend/</text>
    
    <rect x="100" y="320" width="200" height="30" rx="3" ry="3" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="115" y="340" font-family="Arial" font-size="14">package.json</text>
    
    <rect x="100" y="360" width="200" height="30" rx="3" ry="3" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="115" y="380" font-family="Arial" font-size="14">next.config.js</text>
    
    <rect x="100" y="400" width="200" height="30" rx="3" ry="3" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="115" y="420" font-family="Arial" font-size="14">tsconfig.json</text>
    
    <rect x="100" y="440" width="200" height="80" rx="3" ry="3" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="115" y="460" font-family="Arial" font-size="14" font-weight="bold">app/</text>
    <text x="130" y="480" font-family="Arial" font-size="12">pages, layouts, routes,</text>
    <text x="130" y="500" font-family="Arial" font-size="12">client-side rendering</text>
    
    <rect x="100" y="530" width="200" height="80" rx="3" ry="3" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="115" y="550" font-family="Arial" font-size="14" font-weight="bold">components/</text>
    <text x="130" y="570" font-family="Arial" font-size="12">UI components, dialogs,</text>
    <text x="130" y="590" font-family="Arial" font-size="12">buttons, inputs, cards</text>
    
    <rect x="100" y="620" width="200" height="60" rx="3" ry="3" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="115" y="640" font-family="Arial" font-size="14" font-weight="bold">lib/</text>
    <text x="130" y="660" font-family="Arial" font-size="12">utilities, hooks, API client</text>
    
    <!-- Backend -->
    <rect x="350" y="130" width="240" height="570" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" />
    <text x="370" y="155" font-family="Arial" font-size="16" font-weight="bold">backend/</text>
    
    <rect x="370" y="170" width="200" height="30" rx="3" ry="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="385" y="190" font-family="Arial" font-size="14">pyproject.toml</text>
    
    <rect x="370" y="210" width="200" height="30" rx="3" ry="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="385" y="230" font-family="Arial" font-size="14">requirements.txt</text>
    
    <rect x="370" y="250" width="200" height="30" rx="3" ry="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="385" y="270" font-family="Arial" font-size="14">main.py</text>
    
    <rect x="370" y="290" width="200" height="80" rx="3" ry="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="385" y="310" font-family="Arial" font-size="14" font-weight="bold">api/</text>
    <text x="400" y="330" font-family="Arial" font-size="12">auth.py, chat.py,</text>
    <text x="400" y="350" font-family="Arial" font-size="12">scenario.py, customer.py</text>
    
    <rect x="370" y="380" width="200" height="80" rx="3" ry="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="385" y="400" font-family="Arial" font-size="14" font-weight="bold">services/</text>
    <text x="400" y="420" font-family="Arial" font-size="12">auth_service.py,</text>
    <text x="400" y="440" font-family="Arial" font-size="12">conversation.py, ai_service.py</text>
    
    <rect x="370" y="470" width="200" height="80" rx="3" ry="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="385" y="490" font-family="Arial" font-size="14" font-weight="bold">models/</text>
    <text x="400" y="510" font-family="Arial" font-size="12">user.py, scenario.py,</text>
    <text x="400" y="530" font-family="Arial" font-size="12">customer.py, conversation.py</text>
    
    <rect x="370" y="560" width="200" height="60" rx="3" ry="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="385" y="580" font-family="Arial" font-size="14" font-weight="bold">db/</text>
    <text x="400" y="600" font-family="Arial" font-size="12">migrations, session, models</text>
    
    <rect x="370" y="630" width="200" height="60" rx="3" ry="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="385" y="650" font-family="Arial" font-size="14" font-weight="bold">rag/</text>
    <text x="400" y="670" font-family="Arial" font-size="12">embeddings, vectors, retriever</text>
    
    <!-- Infrastructure -->
    <rect x="620" y="130" width="240" height="310" rx="5" ry="5" fill="#e1f5fe" stroke="#0277bd" stroke-width="1" />
    <text x="640" y="155" font-family="Arial" font-size="16" font-weight="bold">infrastructure/</text>
    
    <rect x="640" y="170" width="200" height="30" rx="3" ry="3" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
    <text x="655" y="190" font-family="Arial" font-size="14">docker-compose.yml</text>
    
    <rect x="640" y="210" width="200" height="60" rx="3" ry="3" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
    <text x="655" y="230" font-family="Arial" font-size="14" font-weight="bold">docker/</text>
    <text x="670" y="250" font-family="Arial" font-size="12">frontend.Dockerfile</text>
    <text x="670" y="270" font-family="Arial" font-size="12">backend.Dockerfile</text>
    
    <rect x="640" y="280" width="200" height="60" rx="3" ry="3" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
    <text x="655" y="300" font-family="Arial" font-size="14" font-weight="bold">k8s/</text>
    <text x="670" y="320" font-family="Arial" font-size="12">deployment files,</text>
    <text x="670" y="340" font-family="Arial" font-size="12">service definitions</text>
    
    <rect x="640" y="350" width="200" height="60" rx="3" ry="3" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
    <text x="655" y="370" font-family="Arial" font-size="14" font-weight="bold">scripts/</text>
    <text x="670" y="390" font-family="Arial" font-size="12">setup, deployment,</text>
    <text x="670" y="410" font-family="Arial" font-size="12">db migration scripts</text>
    
    <!-- Project files -->
    <rect x="620" y="450" width="240" height="250" rx="5" ry="5" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1" />
    <text x="640" y="475" font-family="Arial" font-size="16" font-weight="bold">Project Files</text>
    
    <rect x="640" y="490" width="200" height="30" rx="3" ry="3" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
    <text x="655" y="510" font-family="Arial" font-size="14">README.md</text>
    
    <rect x="640" y="530" width="200" height="30" rx="3" ry="3" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
    <text x="655" y="550" font-family="Arial" font-size="14">LICENSE</text>
    
    <rect x="640" y="570" width="200" height="30" rx="3" ry="3" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
    <text x="655" y="590" font-family="Arial" font-size="14">.gitignore</text>
    
    <rect x="640" y="610" width="200" height="30" rx="3" ry="3" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
    <text x="655" y="630" font-family="Arial" font-size="14">.env.example</text>
    
    <rect x="640" y="650" width="200" height="30" rx="3" ry="3" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
    <text x="655" y="670" font-family="Arial" font-size="14">.github/workflows/</text>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(780, 70)">
    <rect x="0" y="0" width="150" height="130" fill="white" stroke="#ccc" stroke-width="1" rx="5" ry="5" />
    <text x="10" y="20" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
    
    <rect x="10" y="30" width="20" height="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" />
    <text x="40" y="38" font-family="Arial" font-size="10">Documentation</text>
    
    <rect x="10" y="50" width="20" height="10" fill="#fff3e0" stroke="#e65100" stroke-width="1" />
    <text x="40" y="58" font-family="Arial" font-size="10">Frontend</text>
    
    <rect x="10" y="70" width="20" height="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" />
    <text x="40" y="78" font-family="Arial" font-size="10">Backend</text>
    
    <rect x="10" y="90" width="20" height="10" fill="#e1f5fe" stroke="#0277bd" stroke-width="1" />
    <text x="40" y="98" font-family="Arial" font-size="10">Infrastructure</text>
    
    <rect x="10" y="110" width="20" height="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1" />
    <text x="40" y="118" font-family="Arial" font-size="10">Project Files</text>
  </g>
  
  <!-- Connections -->
  <g id="connections" stroke="#666" stroke-width="1" stroke-dasharray="3,3">
    <line x1="180" y1="170" x2="640" y2="490" /> <!-- prd.md to README.md -->
    <line x1="470" y1="250" x2="640" y2="170" /> <!-- main.py to docker-compose.yml -->
    <line x1="300" y1="340" x2="370" y2="340" /> <!-- frontend package.json to backend api -->
    <line x1="470" y1="470" x2="740" y2="670" /> <!-- models to .github/workflows -->
    <line x1="200" y1="620" x2="370" y2="340" /> <!-- frontend lib to backend api -->
  </g>
</svg> 