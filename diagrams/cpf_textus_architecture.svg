<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">CPF Board TextUs - System Architecture</text>
  
  <!-- Layers -->
  <g id="layers">
    <!-- Client Layer -->
    <rect x="100" y="100" width="800" height="150" rx="10" ry="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
    <text x="500" y="125" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Frontend (Next.js)</text>
    
    <!-- Client Components - Reorganized -->
    <rect x="150" y="150" width="160" height="80" rx="5" ry="5" fill="#bbdefb" stroke="#1976d2" stroke-width="1" />
    <text x="230" y="180" font-family="Arial" font-size="14" text-anchor="middle">Dashboard</text>
    <text x="230" y="200" font-family="Arial" font-size="12" text-anchor="middle">Performance Metrics</text>
    
    <rect x="320" y="150" width="160" height="80" rx="5" ry="5" fill="#bbdefb" stroke="#1976d2" stroke-width="1" />
    <text x="400" y="180" font-family="Arial" font-size="14" text-anchor="middle">Chat Interface</text>
    <text x="400" y="200" font-family="Arial" font-size="12" text-anchor="middle">Real-time Messaging</text>
    
    <rect x="490" y="150" width="160" height="80" rx="5" ry="5" fill="#bbdefb" stroke="#1976d2" stroke-width="1" />
    <text x="570" y="180" font-family="Arial" font-size="14" text-anchor="middle">Scenario Browser</text>
    <text x="570" y="200" font-family="Arial" font-size="12" text-anchor="middle">Selection &amp; Configuration</text>
    
    <rect x="660" y="150" width="160" height="80" rx="5" ry="5" fill="#bbdefb" stroke="#1976d2" stroke-width="1" />
    <text x="740" y="180" font-family="Arial" font-size="14" text-anchor="middle">Admin Interface</text>
    <text x="740" y="200" font-family="Arial" font-size="12" text-anchor="middle">Management Tools</text>
    
    <!-- API Layer -->
    <rect x="100" y="280" width="800" height="100" rx="10" ry="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
    <text x="500" y="305" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">API Layer (FastAPI)</text>
    
    <!-- API Components - Reorganized -->
    <rect x="150" y="330" width="100" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="200" y="355" font-family="Arial" font-size="14" text-anchor="middle">Auth API</text>
    
    <rect x="320" y="330" width="100" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="370" y="355" font-family="Arial" font-size="14" text-anchor="middle">Chat API</text>
    
    <rect x="430" y="330" width="100" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="480" y="355" font-family="Arial" font-size="14" text-anchor="middle">WebSocket</text>
    
    <rect x="540" y="330" width="100" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="590" y="355" font-family="Arial" font-size="14" text-anchor="middle">Scenario API</text>
    
    <rect x="650" y="330" width="100" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="700" y="355" font-family="Arial" font-size="14" text-anchor="middle">Customer API</text>
    
    <rect x="760" y="330" width="100" height="40" rx="5" ry="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
    <text x="810" y="355" font-family="Arial" font-size="14" text-anchor="middle">Analytics API</text>
    
    <!-- Services Layer -->
    <rect x="100" y="410" width="800" height="140" rx="10" ry="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
    <text x="500" y="435" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Services Layer</text>
    
    <!-- Services Components - Reorganized -->
    <rect x="150" y="460" width="180" height="70" rx="5" ry="5" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="240" y="485" font-family="Arial" font-size="14" text-anchor="middle">Auth Service</text>
    <text x="240" y="505" font-family="Arial" font-size="12" text-anchor="middle">JWT, Rate Limiting</text>
    
    <rect x="360" y="460" width="280" height="70" rx="5" ry="5" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="500" y="485" font-family="Arial" font-size="14" text-anchor="middle">Conversation Scheduler</text>
    <text x="500" y="505" font-family="Arial" font-size="12" text-anchor="middle">Chat Management, WebSocket Handling</text>
    
    <rect x="670" y="460" width="180" height="70" rx="5" ry="5" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" />
    <text x="760" y="485" font-family="Arial" font-size="14" text-anchor="middle">AI Service</text>
    <text x="760" y="505" font-family="Arial" font-size="12" text-anchor="middle">OpenAI Integration, RAG</text>
    
    <!-- Data Layer -->
    <rect x="100" y="580" width="800" height="160" rx="10" ry="10" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" />
    <text x="500" y="605" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Data Layer</text>
    
    <!-- Data Components - Reorganized -->
    <rect x="150" y="630" width="200" height="90" rx="5" ry="5" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
    <text x="250" y="655" font-family="Arial" font-size="14" text-anchor="middle">PostgreSQL Database</text>
    <text x="250" y="675" font-family="Arial" font-size="12" text-anchor="middle">Users, Scenarios, Customers,</text>
    <text x="250" y="695" font-family="Arial" font-size="12" text-anchor="middle">Conversations, Analytics</text>
    
    <rect x="400" y="630" width="200" height="90" rx="5" ry="5" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
    <text x="500" y="655" font-family="Arial" font-size="14" text-anchor="middle">Redis Cache</text>
    <text x="500" y="675" font-family="Arial" font-size="12" text-anchor="middle">Rate Limiting, Session Data,</text>
    <text x="500" y="695" font-family="Arial" font-size="12" text-anchor="middle">WebSocket State</text>
    
    <rect x="650" y="630" width="200" height="90" rx="5" ry="5" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
    <text x="750" y="655" font-family="Arial" font-size="14" text-anchor="middle">Vector Database</text>
    <text x="750" y="675" font-family="Arial" font-size="12" text-anchor="middle">RAG Document Embeddings</text>
    <text x="750" y="695" font-family="Arial" font-size="12" text-anchor="middle">CPF Knowledge Base</text>
  </g>
  
  <!-- Connections - Reorganized for cleaner flow -->
  <g id="connections" stroke="#666" stroke-width="2" stroke-dasharray="5,5">
    <!-- Frontend to API -->
    <line x1="230" y1="230" x2="200" y2="330" /> <!-- Dashboard to Auth -->
    <line x1="400" y1="230" x2="370" y2="330" /> <!-- Chat Interface to Chat API -->
    <line x1="400" y1="230" x2="480" y2="330" /> <!-- Chat Interface to WebSocket -->
    <line x1="570" y1="230" x2="590" y2="330" /> <!-- Scenario Browser to Scenario API -->
    <line x1="740" y1="230" x2="700" y2="330" /> <!-- Admin Interface to Customer API -->
    <line x1="740" y1="230" x2="810" y2="330" /> <!-- Admin Interface to Analytics API -->
    
    <!-- API to Services -->
    <line x1="200" y1="370" x2="240" y2="460" /> <!-- Auth API to Auth Service -->
    <line x1="370" y1="370" x2="500" y2="460" /> <!-- Chat API to Conversation Scheduler -->
    <line x1="480" y1="370" x2="500" y2="460" /> <!-- WebSocket to Conversation Scheduler -->
    <line x1="590" y1="370" x2="760" y2="460" /> <!-- Scenario API to AI Service -->
    <line x1="700" y1="370" x2="760" y2="460" /> <!-- Customer API to AI Service -->
    <line x1="810" y1="370" x2="760" y2="460" /> <!-- Analytics API to AI Service -->
    
    <!-- Services to Data -->
    <line x1="240" y1="530" x2="250" y2="630" /> <!-- Auth Service to PostgreSQL -->
    <line x1="240" y1="530" x2="500" y2="630" /> <!-- Auth Service to Redis -->
    <line x1="500" y1="530" x2="250" y2="630" /> <!-- Conversation Scheduler to PostgreSQL -->
    <line x1="500" y1="530" x2="500" y2="630" /> <!-- Conversation Scheduler to Redis -->
    <line x1="760" y1="530" x2="250" y2="630" /> <!-- AI Service to PostgreSQL -->
    <line x1="760" y1="530" x2="750" y2="630" /> <!-- AI Service to Vector DB -->
  </g>
  
  <!-- External Services -->
  <g id="external">
    <rect x="100" y="30" width="120" height="40" rx="20" ry="20" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1" />
    <text x="160" y="55" font-family="Arial" font-size="14" text-anchor="middle">Client Browsers</text>
    <line x1="160" y1="70" x2="160" y2="100" stroke="#666" stroke-width="2" />
    
    <rect x="950" y="500" width="40" height="120" rx="5" ry="5" fill="#e8eaf6" stroke="#3949ab" stroke-width="1" />
    <text x="970" y="560" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(90 970,560)">OpenAI API</text>
    <line x1="950" y1="560" x2="760" y2="495" stroke="#666" stroke-width="2" stroke-dasharray="5,5" />
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(780, 30)">
    <rect x="0" y="0" width="200" height="80" fill="white" stroke="#ccc" stroke-width="1" rx="5" ry="5" />
    <text x="10" y="20" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
    
    <rect x="10" y="30" width="20" height="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" />
    <text x="40" y="38" font-family="Arial" font-size="10">Frontend Layer</text>
    
    <rect x="10" y="45" width="20" height="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" />
    <text x="40" y="53" font-family="Arial" font-size="10">API Layer</text>
    
    <rect x="10" y="60" width="20" height="10" fill="#fff3e0" stroke="#e65100" stroke-width="1" />
    <text x="40" y="68" font-family="Arial" font-size="10">Services Layer</text>
    
    <rect x="110" y="30" width="20" height="10" fill="#e1f5fe" stroke="#0277bd" stroke-width="1" />
    <text x="140" y="38" font-family="Arial" font-size="10">Data Layer</text>
    
    <line x1="110" y1="53" x2="130" y2="53" stroke="#666" stroke-width="2" stroke-dasharray="5,5" />
    <text x="140" y="55" font-family="Arial" font-size="10">Data Flow</text>
  </g>
</svg> 