services:
  backend:
    container_name: cpf-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    depends_on:
      - postgres
    restart: always

  postgres:
    container_name: cpf-postgres
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cpf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  frontend:
    container_name: cpf-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
