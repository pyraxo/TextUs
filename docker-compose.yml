services:
  backend:
    container_name: cpf-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    depends_on:
      - mongo

  mongo:
    container_name: cpf-mongo
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin

  frontend:
    container_name: cpf-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env
    depends_on:
      - backend
      - mongo
